[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rsa-lab"
version = "1.0.0"
description = "RSA laboratory: Miller-Rabin primality, key generation, CRT decryption, malleability demo, key-size benchmarks. Zero dependencies."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["rsa", "cryptography", "education", "primality", "crt", "cli"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
]

[project.scripts]
rsa-lab = "rsalab.cli:main"

[tool.setuptools.packages.find]
include = ["rsalab*"]
